name: Release

on:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Stable release tag to validate during the non-publishing rehearsal
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && 'publication' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    name: Verify release identity and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      expected-tag: ${{ steps.candidate.outputs.expected-tag }}
    steps:
      - name: Check out complete source and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate the candidate tag against project metadata
        id: candidate
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.expected_tag || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Release rehearsals must run from the default branch."
              exit 1
            fi
            expected_tag="$DISPATCH_TAG"
          else
            expected_tag="$GITHUB_REF_NAME"
          fi
          node scripts/check-release-contract.mjs --expected-tag "$expected_tag"
          echo "expected-tag=$expected_tag" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag, signer, GitHub status and exact main commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "::error::$tag must be an annotated tag."
            exit 1
          fi
          direct_type="$(git cat-file -p "refs/tags/$tag" | awk '$1 == "type" { print $2; exit }')"
          if [[ "$direct_type" != "commit" ]]; then
            echo "::error::$tag must point directly to a commit, not another tag."
            exit 1
          fi
          git config --local gpg.ssh.allowedSignersFile \
            "$GITHUB_WORKSPACE/.github/release-signers.allowed"
          git verify-tag "$tag"
          release_commit="$(git rev-parse "$tag^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "::error::$tag must resolve to the exact current main commit."
            exit 1
          fi
          tag_object="$(git rev-parse "refs/tags/$tag")"
          verification="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          if [[ "$(jq -r '.verification.verified' <<<"$verification")" != "true" ||
                "$(jq -r '.verification.reason' <<<"$verification")" != "valid" ]]; then
            echo "::error::GitHub does not report a valid signature for $tag."
            exit 1
          fi
          if [[ "$(jq -r '.object.type' <<<"$verification")" != "commit" ||
                "$(jq -r '.object.sha' <<<"$verification")" != "$release_commit" ]]; then
            echo "::error::GitHub tag object does not resolve directly to the release commit."
            exit 1
          fi

  package:
    name: Package (${{ matrix.label }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build app image on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Build app image on Unix
        if: runner.os != 'Windows'
        run: ./scripts/package.sh

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\dist | Out-Null
          Compress-Archive -LiteralPath 'target\package\JDoor Assist' -DestinationPath 'target\dist\jdoor-assist-windows-x64.zip'
          $hash = (Get-FileHash 'target\dist\jdoor-assist-windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          $checksumPath = Join-Path $PWD 'target\dist\jdoor-assist-windows-x64.zip.sha256'
          [IO.File]::WriteAllText(
            $checksumPath,
            "$hash  jdoor-assist-windows-x64.zip`n",
            [Text.Encoding]::ASCII
          )

      - name: Archive macOS app image
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/dist
          ditto -c -k --sequesterRsrc --keepParent "target/package/JDoor Assist.app" "target/dist/jdoor-assist-macos-arm64.zip"
          cd target/dist
          shasum -a 256 "jdoor-assist-macos-arm64.zip" > "jdoor-assist-macos-arm64.zip.sha256"

      - name: Archive Linux app image
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/dist
          tar -C target/package -czf target/dist/jdoor-assist-linux-x64.tar.gz "JDoor Assist"
          cd target/dist
          sha256sum jdoor-assist-linux-x64.tar.gz > jdoor-assist-linux-x64.tar.gz.sha256

      - name: Add SBOM to Linux release assets
        if: runner.os == 'Linux'
        run: cp target/jdoor-assist-sbom.json target/dist/jdoor-assist-sbom.json

      - name: Attest release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/dist/*

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          path: target/dist/*

  assemble:
    name: Assemble verified release candidate
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-candidate
          merge-multiple: true

      - name: Verify checksums and exact candidate inventory
        working-directory: release-candidate
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-assets.txt" <<'EOF'
          jdoor-assist-linux-x64.tar.gz
          jdoor-assist-linux-x64.tar.gz.sha256
          jdoor-assist-macos-arm64.zip
          jdoor-assist-macos-arm64.zip.sha256
          jdoor-assist-sbom.json
          jdoor-assist-windows-x64.zip
          jdoor-assist-windows-x64.zip.sha256
          EOF
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
          jq -e '.bomFormat == "CycloneDX"' jdoor-assist-sbom.json > /dev/null

      - name: Upload the exact non-publishing candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.preflight.outputs.expected-tag }}
          if-no-files-found: error
          retention-days: 14
          path: release-candidate/*

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.preflight.outputs.expected-tag }}
          path: release-assets

      - name: Verify downloaded release assets
        working-directory: release-assets
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "JDoor Assist ${GITHUB_REF_NAME}"
